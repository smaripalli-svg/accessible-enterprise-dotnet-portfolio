name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  api-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/AccessibleCaseManagement.Api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore

  ui-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/accessible-case-management-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
